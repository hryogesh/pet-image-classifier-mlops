name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/pet-image-classifier:latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image from GHCR
        run: docker pull ${APP_IMAGE}

      - name: Run docker compose deployment
        run: |
          export APP_IMAGE=${APP_IMAGE}
          export PULL_POLICY=always
          docker compose up -d

      - name: Smoke tests
        run: |
          sleep 5
          bash scripts/smoke_test.sh http://localhost:8000
          bash scripts/smoke_test_predict.sh http://localhost:8000 data/processed/train/cats/0.jpg

      - name: Show app logs on failure
        if: failure()
        run: docker compose logs app || true
