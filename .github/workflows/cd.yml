name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run docker-compose
        run: |
          docker compose build
          docker compose up -d
      - name: Smoke tests
        run: |
          sleep 5
          curl -f http://localhost:8000/health
          echo 'done'
