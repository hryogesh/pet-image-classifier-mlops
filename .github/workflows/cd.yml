name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run docker-compose
        run: |
          docker compose build
          docker compose up -d
      - name: Build image for push
        run: |
          IMAGE=${{ secrets.IMAGE_NAME || 'catsdogs' }}
          echo "Building image $IMAGE:latest for tagging/push"
          docker build -t ${IMAGE}:latest .
      - name: Log in to registry
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image (tagged)
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        run: |
          IMAGE=${{ secrets.IMAGE_NAME || 'catsdogs' }}
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "Tagging and pushing ${IMAGE}:latest and ${IMAGE}:$SHORT_SHA"
          docker tag ${IMAGE}:latest ${IMAGE}:$SHORT_SHA
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:$SHORT_SHA
      - name: Smoke tests
        run: |
          sleep 5
          bash scripts/smoke_test.sh http://localhost:8000
          echo 'Running predictive smoke test (posts sample image)'
          bash scripts/smoke_test_predict.sh http://localhost:8000 || (
            echo 'Predictive smoke test failed; dumping logs' && docker compose logs web || true
            exit 1
          )
