name: Container Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t catsdogs:ci .

      - name: Start container
        run: |
          docker run -d --name catsdogs_ci -p 8000:8000 \
            -v "${{ github.workspace }}/models:/app/models" \
            -e MODEL_PATH=/app/models/model.pt catsdogs:ci

      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "service up"; break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "timed out waiting for service"; docker logs catsdogs_ci || true; exit 1
            fi
          done

      - name: Predict smoke test
        run: |
          echo "Running predict smoke test"
          curl -sS -X POST "http://127.0.0.1:8000/predict" -F "file=@data/raw/PetImages/Cat/7157.jpg" -o /tmp/pred.json || true
          cat /tmp/pred.json

      - name: Stop container
        run: |
          docker stop catsdogs_ci || true
