name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pet-image-classifier
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${IMAGE_NAME}:latest .

      - name: Run container for smoke tests
        run: |
          docker run -d --name web -p 8000:8000 -v "${{ github.workspace }}/models:/app/models" ${IMAGE_NAME}:latest

      - name: Smoke tests (containerized)
        run: |
          sleep 5
          bash scripts/smoke_test.sh http://localhost:8000
          bash scripts/smoke_test_predict.sh http://localhost:8000 data/processed/train/cats/0.jpg

      - name: Stop container
        run: docker stop web || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:$SHORT_SHA
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:$SHORT_SHA
