name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t ${{ secrets.IMAGE_NAME || 'catsdogs' }}:latest .
      - name: Log in to registry
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        run: |
          docker tag ${{ secrets.IMAGE_NAME || 'catsdogs' }}:latest ${{ secrets.IMAGE_NAME }}:latest
          docker push ${{ secrets.IMAGE_NAME }}:latest
