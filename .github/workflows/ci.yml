name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ secrets.IMAGE_NAME || 'catsdogs' }}:latest .

      - name: Run container for smoke tests
        run: |
          docker run -d --name web -p 8000:8000 ${{ secrets.IMAGE_NAME || 'catsdogs' }}:latest || docker ps -a

      - name: Smoke tests (containerized)
        run: |
          sleep 5
          bash scripts/smoke_test.sh http://localhost:8000
          bash scripts/smoke_test_predict.sh http://localhost:8000
      - name: Stop container
        run: |
          docker stop web || true
      - name: Log in to registry
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image (tagged)
        if: secrets.REGISTRY_USERNAME && secrets.REGISTRY_PASSWORD
        run: |
          IMAGE=${{ secrets.IMAGE_NAME || 'catsdogs' }}
          echo "Image: $IMAGE"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "Tagging image with short SHA: $SHORT_SHA"
          docker tag ${IMAGE}:latest ${IMAGE}:$SHORT_SHA
          docker tag ${IMAGE}:latest ${IMAGE}:latest
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:$SHORT_SHA
