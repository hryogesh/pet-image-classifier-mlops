stages:
  preprocess:
    cmd: python src/data/preprocess.py --input_dir data/raw --output_dir data/processed
    deps:
      - src/data/preprocess.py
    outs:
      - data/processed
  train:
    cmd: python src/train.py --data_dir data/processed --save_dir models
    deps:
      - src/train.py
      - src/model.py
    outs:
      - models/model.pt
