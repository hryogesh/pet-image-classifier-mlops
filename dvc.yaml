stages:
  preprocess:
    cmd: python src/data/preprocess.py --input_dir data/raw --output_dir data/processed --img_size ${train.img_size}
    deps:
      - src/data/preprocess.py
    outs:
      - data/processed
  train:
    cmd: python src/train.py --data_dir data/processed --save_dir models --epochs ${train.epochs} --batch_size ${train.batch_size} --lr ${train.lr} --img_size ${train.img_size} --model_name ${train.model_name}
    deps:
      - src/train.py
      - src/model.py
    params:
      - train
    outs:
      - models/model.pt
